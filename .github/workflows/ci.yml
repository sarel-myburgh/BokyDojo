# =============================================================================
# BokyDojo CI — TODO 0.2.6 + 0.2.7
# Lint, test, build image, dependency audit, SAST, secret scanning
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bokydojo:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Dependency audit — TODO 0.2.7 / SEC §7.4
      - run: pip install pip-audit
      - run: pip-audit
      # SAST with Bandit — TODO 0.2.7
      - run: pip install bandit[toml]
      - run: bandit -r apps/ -c pyproject.toml --severity-level medium
      # Secret scanning with detect-secrets — TODO 0.2.7
      #
      # ⚠ The previous version embedded a Python one-liner as an unquoted,
      # multi-line YAML scalar. `if results:` made YAML try to read a mapping,
      # the workflow file failed to parse, and *every* run since the repository
      # gained a remote failed in 0s without executing a single step. Any
      # embedded script must be a block scalar.
      #
      # ⚠ Scans tracked files against the reviewed baseline, not `--all-files`:
      # the latter walks .venv/ and node_modules/ when they exist locally, and
      # `scan` *rewrites* the baseline rather than failing on new findings.
      # `detect-secrets-hook` is what pre-commit runs, so CI and the hook now
      # agree.
      - run: pip install detect-secrets
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      # Untranslated strings check — TODO 0.4.6
      - name: Check for untranslated template strings
        # ⚠ The previous version piped `find` into `head -1` and tested the
        # pipeline's status — which is head's, and head returns 0 on empty
        # input. The condition was therefore always true and the step always
        # failed, whether or not it had found anything. It flagged nothing and
        # failed regardless, which is the worst of both.
        run: |
          matches="$(grep -rlP '(?<=>)[A-Z][a-z]+(?:\s+[a-z]+)+(?=<)' templates --include='*.html' || true)"
          if [ -n "$matches" ]; then
            echo "ERROR: hardcoded English strings in templates; wrap them in {% translate %}:"
            echo "$matches"
            exit 1
          fi
          echo "No untranslated template strings found."
