[project]
name = "bokydojo"
version = "0.1.0"
description = "Student Information System for martial arts organisations"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    # Field-level encryption (AES-GCM envelope) for medical and safeguarding
    # data — TODO 0.3.8, SEC 2.3. No stdlib equivalent exists.
    "cryptography>=43.0",
    # Image re-encoding to strip EXIF (including GPS) from uploaded
    # photographs — TODO 0.3.9, SEC 2.3.
    "Pillow>=11.0",
    # RFC 5545 recurrence expansion for class templates — TODO 1.4.2, plan §4.5.
    # Already present transitively via celery; declared because we import it.
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "python-json-logger>=3.2",
    "celery[redis]>=5.4",
    "gunicorn>=22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The repository also contains templates, static assets, media and locale
# directories. Only Django's Python packages belong in the distribution.
include = ["apps*", "config*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "black>=24.10",
    # Used by tests/test_deployment_config.py to parse the CI workflow. A broken
    # workflow file fails every run in 0s without executing a step, which is
    # invisible unless somebody reads the emails — so the suite checks it.
    "pyyaml>=6.0",
    # ⚠ So `make check` can run the same secret scan CI does. Without it that
    # step exists only in CI, which is where the last three red builds came from.
    "detect-secrets>=1.5",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
