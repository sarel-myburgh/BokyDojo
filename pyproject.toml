[project]
name = "dojomaster"
version = "0.1.0"
description = "Student Information System for martial arts organisations"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    # Field-level encryption (AES-GCM envelope) for medical and safeguarding
    # data — TODO 0.3.8, SEC 2.3. No stdlib equivalent exists.
    "cryptography>=43.0",
    # Image re-encoding to strip EXIF (including GPS) from uploaded
    # photographs — TODO 0.3.9, SEC 2.3.
    "Pillow>=11.0",
    "python-dotenv>=1.0",
    "python-json-logger>=3.2",
    "celery[redis]>=5.4",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
