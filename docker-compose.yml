# =============================================================================
# DojoMaster — Docker / Podman Compose
# TODO 0.2.2 — web, worker, db (Postgres 16), redis, caddy
#
# Runs the published image; nothing here needs the source:
#   ./scripts/init-env.sh          # once, generates .env with real secrets
#   podman-compose up -d           # or: docker compose up -d
#
# To build from this checkout instead of pulling:
#   podman-compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# =============================================================================

x-image: &image ghcr.io/sarel-myburgh/dojomaster:${DOJOMASTER_TAG:-latest}

services:
  web:
    image: *image
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    # ⚠ No `ports:`. The web container is reachable only through Caddy, which is
    # what makes trusting X-Forwarded-Proto safe (see config/settings/prod.py).
    # Publishing 8000 here would turn that into a way to fake HTTPS.
    restart: unless-stopped

  worker:
    image: *image
    command: celery -A config worker -l info
    env_file: .env
    # ⚠ The worker must not migrate. Two containers racing to apply the same
    # migrations is how a self-host deployment gets a half-applied schema.
    environment:
      DOJOMASTER_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dojomaster}
      POSTGRES_USER: ${POSTGRES_USER:-dojomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojomaster}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dojomaster} -d ${POSTGRES_DB:-dojomaster}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2-alpine
    # ⚠ High ports by default so this runs under *rootless* Podman, which cannot
    # bind below 1024. A real deployment with a domain needs 80 and 443 for
    # ACME — set DOJOMASTER_HTTP_PORT=80 and DOJOMASTER_HTTPS_PORT=443, and
    # either run rootful or lower net.ipv4.ip_unprivileged_port_start.
    ports:
      - "${DOJOMASTER_HTTP_PORT:-8080}:80"
      - "${DOJOMASTER_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static only, read-only. Without this Caddy's /static/* handler roots at a
      # path that does not exist in its container, every stylesheet and script
      # 404s in production, and the service worker's cache.addAll rejects on
      # install — which silently kills the 1.6.x offline queue.
      - static:/app/staticfiles:ro
      # ⚠ The `media` volume is deliberately NOT mounted here, and mounting it is
      # a data breach rather than a fix. See the Caddyfile: MEDIA_ROOT holds
      # consent documents, medical attachments and photographs of children, all
      # of which Django serves through permission-checked, audited views. A
      # file_server over them answers to nobody.
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
