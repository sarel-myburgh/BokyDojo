# =============================================================================
# DojoMaster — Docker Compose
# TODO 0.2.2 — web, worker, db (Postgres 16), redis, caddy
# =============================================================================

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dojomaster}
      POSTGRES_USER: ${POSTGRES_USER:-dojomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojomaster}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dojomaster} -d ${POSTGRES_DB:-dojomaster}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static only, read-only. Without this Caddy's /static/* handler roots at a
      # path that does not exist in its container, every stylesheet and script
      # 404s in production, and the service worker's cache.addAll rejects on
      # install — which silently kills the 1.6.x offline queue.
      - static:/app/staticfiles:ro
      # ⚠ The `media` volume is deliberately NOT mounted here, and mounting it is
      # a data breach rather than a fix. See the Caddyfile: MEDIA_ROOT holds
      # consent documents, medical attachments and photographs of children, all
      # of which Django serves through permission-checked, audited views. A
      # file_server over them answers to nobody.
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
