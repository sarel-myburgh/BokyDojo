{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Sign in" %} — DojoMaster{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-semibold text-center mb-1">DojoMaster</h1>
    <p class="text-sm text-gray-500 text-center mb-8">{% translate "Dojo management" %}</p>

    {% if error %}
      <div role="alert" class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-4" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label for="email" class="block text-sm font-medium mb-1">{% translate "Email" %}</label>
        <input id="email" name="email" type="email" autocomplete="username" required
               autocapitalize="none" spellcheck="false" inputmode="email"
               class="w-full rounded-lg border border-gray-300 px-4 py-3 text-base focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">{% translate "Password" %}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-gray-300 px-4 py-3 text-base focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900">
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-gray-900 px-4 py-3 text-base font-medium text-white active:bg-gray-700">
        {% translate "Sign in" %}
      </button>
    </form>
  </div>
</main>
{% endblock %}
