{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Password changed" %} — DojoMaster{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-semibold mb-2">{% translate "Password changed" %}</h1>
    <p class="text-gray-600 mb-5">{% translate "Your password has been changed. Sign in with the new password." %}</p>
    <a href="{% url 'login' %}" class="inline-block rounded-lg bg-gray-900 px-4 py-3 text-white">{% translate "Sign in" %}</a>
  </div>
</main>
{% endblock %}
