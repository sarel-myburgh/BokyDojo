{% load static %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {# Sumi. Matches gray-900 in tailwind.config.cjs — keep the two in step. #}
    <meta name="theme-color" content="#15130f">
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <title>{% block title %}BokyDojo{% endblock %}</title>

    {# Compiled and self-hosted: runtime CDNs cannot satisfy the strict CSP. #}
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link rel="stylesheet" href="{% static 'css/dojo.css' %}">

    {% block extra_head %}{% endblock %}
    <script type="module" src="{% static 'js/pwa.js' %}"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">
    {% block body %}{% endblock %}
</body>
</html>
